<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Colaboracion (Progresion y Coexistencia)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;

const BG = '#050505';
const CANVAS_W = 1280;
const CANVAS_H = 720;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const TASKS_VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const CHARGE_RADIUS = 120; 
const CHARGE_SPEED = 0.008; 
const SMOOTH_FACTOR = 0.3;

const SHAPE_TYPES = ['cuadrado', 'circulo', 'triangulo', 'cuadrado'];
const COLORS = [
  '255, 122, 26',  
  '52, 199, 89',   
  '0, 122, 255',   
  '175, 82, 222', 
];

function generateNodes() {
  return [
    { id: 0, x: CANVAS_W * 0.2, y: CANVAS_H * 0.4, req: 0, baseAlpha: 0.6, charge: 0, done: false },
    { id: 1, x: CANVAS_W * 0.4, y: CANVAS_H * 0.6, req: 1, baseAlpha: 0.3, charge: 0, done: false },
    { id: 2, x: CANVAS_W * 0.6, y: CANVAS_H * 0.4, req: 2, baseAlpha: 0.1, charge: 0, done: false },
    { id: 3, x: CANVAS_W * 0.8, y: CANVAS_H * 0.6, req: 3, baseAlpha: 0.02, charge: 0, done: false }
  ];
}

function generateShapes(nodes) {
  return nodes.map(n => ({
    id: n.id,
    nodeId: n.id,
    forma: SHAPE_TYPES[n.id],
    color: COLORS[n.id],
    x: n.x, y: n.y,
    size: 40,
    state: 'IDLE', 
    orbitAngle: Math.random() * Math.PI * 2
  }));
}

function drawShape(ctx, shape) {
  ctx.save();
  ctx.translate(shape.x, shape.y);
  ctx.rotate(shape.orbitAngle);
  
  ctx.fillStyle = `rgb(${shape.color})`;
  
  if (shape.state === 'FOLLOWING') {
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = `rgb(${shape.color})`;
  } else {
    ctx.strokeStyle = 'transparent';
    ctx.lineWidth = 0;
    ctx.shadowBlur = 0;
  }

  ctx.beginPath();
  if (shape.forma === 'cuadrado') {
    ctx.rect(-shape.size / 2, -shape.size / 2, shape.size, shape.size);
  } else if (shape.forma === 'circulo') {
    ctx.arc(0, 0, shape.size / 2, 0, Math.PI * 2);
  } else {
    ctx.moveTo(-shape.size / 2, shape.size / 2);
    ctx.lineTo(shape.size / 2, 0);
    ctx.lineTo(-shape.size / 2, -shape.size / 2);
    ctx.closePath();
  }
  
  ctx.fill();
  if (shape.state === 'FOLLOWING') ctx.stroke();
  ctx.restore();
}

function App() {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const landmarkerRef = useRef(null);
  
  const nodesRef = useRef(generateNodes());
  const shapesRef = useRef(generateShapes(nodesRef.current));
  
  const cursorRef = useRef({ x: CANVAS_W / 2, y: CANVAS_H / 2, visible: false });
  const hubChargeRef = useRef(0);
  const rafRef = useRef(null);

  const [status, setStatus] = useState('Iniciando camara...');
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let stream;
    let cancelled = false;

    async function setup() {
      try {
        setStatus('Cargando modelo de tracking...');
        const { HandLandmarker, FilesetResolver } = await import(TASKS_VISION_URL);
        const vision = await FilesetResolver.forVisionTasks(`${TASKS_VISION_URL}/wasm`);

        let landmarker;
        try {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        } catch (gpuErr) {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        }
        if (cancelled) return;
        landmarkerRef.current = landmarker;

        setStatus('Pidiendo acceso a la camara...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }, audio: false,
        });
        if (cancelled) return;
        videoRef.current.srcObject = stream;
        await new Promise((res) => { videoRef.current.onloadedmetadata = res; });
        await videoRef.current.play();
        setStatus('Listo -- Acercá tu mano al primer núcleo para cargarlo');
        setReady(true);
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }
    setup();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  useEffect(() => {
    if (!ready) return;
    const ctx = canvasRef.current.getContext('2d');
    let lastVideoTime = -1;

    function loop() {
      const now = performance.now();
      const video = videoRef.current;
      const landmarker = landmarkerRef.current;
      const cursor = cursorRef.current;
      const nodes = nodesRef.current;
      const shapes = shapesRef.current;

    
      if (video.readyState >= 2 && landmarker) {
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = landmarker.detectForVideo(video, now);
          if (result.landmarks && result.landmarks.length > 0) {
            const tip = result.landmarks[0][8]; 
            const targetX = (1 - tip.x) * CANVAS_W;
            const targetY = tip.y * CANVAS_H;
            cursor.x += (targetX - cursor.x) * SMOOTH_FACTOR;
            cursor.y += (targetY - cursor.y) * SMOOTH_FACTOR;
            cursor.visible = true;
          } else {
            cursor.visible = false;
          }
        }
      }

      const followersAtStart = shapes.filter(s => s.state === 'FOLLOWING');
      const activeFollowersCount = followersAtStart.length;
      let isChargingAny = false; 

     
      for (const node of nodes) {
        if (node.done) continue;

        let isCharging = false;
        
        if (cursor.visible) {
          const dist = Math.hypot(cursor.x - node.x, cursor.y - node.y);
          
          if (dist < CHARGE_RADIUS) {
            if (activeFollowersCount >= node.req) {
              isCharging = true;
              isChargingAny = true;
              node.charge += CHARGE_SPEED;
              
              if (node.charge >= 1) {
                node.charge = 1;
                node.done = true;
                
                const shape = shapes.find(s => s.nodeId === node.id);
                if (shape) shape.state = 'FOLLOWING';
              }
            } else {
              node.showWarning = true;
            }
          } else {
            node.showWarning = false;
          }
        }

        if (!isCharging) {
          node.charge = Math.max(0, node.charge - 0.005);
        }
      }

    
      const currentFollowers = shapes.filter(s => s.state === 'FOLLOWING');
      const currentFollowersCount = currentFollowers.length;

      for (const shape of shapes) {
        shape.orbitAngle += 0.03;
        
        if (shape.state === 'IDLE') {
          const node = nodes.find(n => n.id === shape.nodeId);
          const targetX = node.x + Math.cos(shape.orbitAngle) * 60;
          const targetY = node.y + Math.sin(shape.orbitAngle) * 60;
          shape.x += (targetX - shape.x) * 0.1;
          shape.y += (targetY - shape.y) * 0.1;
        } 
        else if (shape.state === 'FOLLOWING') {
          const fIndex = currentFollowers.indexOf(shape);
          const offset = (Math.PI * 2 / currentFollowersCount) * fIndex;
          const orbitDist = 90;
          
          const targetX = cursor.x + Math.cos(shape.orbitAngle + offset) * orbitDist;
          const targetY = cursor.y + Math.sin(shape.orbitAngle + offset) * orbitDist;
          
          shape.x += (targetX - shape.x) * 0.15;
          shape.y += (targetY - shape.y) * 0.15;
        }
      }

    
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
      for (let y = 0; y < CANVAS_H; y += 4) ctx.fillRect(0, y, CANVAS_W, 1);

      for (const node of nodes) {
        const pulse = Math.sin(now * 0.005) * 4;
        let alpha = node.baseAlpha + (node.charge * (1 - node.baseAlpha));
        if (node.done) alpha = 1;

        const rgb = node.showWarning ? '255, 50, 50' : '255, 122, 26';

       
        ctx.beginPath();
        ctx.arc(node.x, node.y, 45, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${rgb}, ${alpha * 0.35})`;
        ctx.lineWidth = 3;
        ctx.stroke();

      
        ctx.beginPath();
        ctx.arc(node.x, node.y, 38, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10, 10, 10, 0.85)';
        ctx.fill();

       
        const maxRadius = 38;
      
        const currentFillRadius = node.done ? (maxRadius + pulse * 0.8) : Math.max(0, node.charge * maxRadius);

        if (node.charge > 0 || node.done) {
        
          ctx.beginPath();
          ctx.arc(node.x, node.y, currentFillRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${rgb}, ${node.done ? 0.95 : (0.5 + node.charge * 0.45)})`;
          ctx.shadowBlur = node.done ? 25 : (node.charge * 18);
          ctx.shadowColor = `rgb(${rgb})`;
          ctx.fill();
          ctx.shadowBlur = 0;

       
          const centerCoreRadius = currentFillRadius * 0.45;
          ctx.beginPath();
          ctx.arc(node.x, node.y, centerCoreRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${node.done ? 0.95 : (node.charge * 0.85)})`;
          ctx.fill();
        } else {
        
          ctx.beginPath();
          ctx.arc(node.x, node.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${rgb}, ${alpha * 0.5})`;
          ctx.fill();
        }

       
        for (let i = 0; i < node.req; i++) {
          const hasThisReq = currentFollowersCount > i;
          ctx.beginPath();
          const px = node.x - (node.req * 12) / 2 + (i * 12) + 6;
          ctx.arc(px, node.y - 65, 4, 0, Math.PI * 2);
          ctx.fillStyle = hasThisReq ? '#FFFFFF' : `rgba(${rgb}, 0.3)`;
          ctx.fill();
        }

      
        if (node.done) {
          ctx.beginPath();
          ctx.arc(node.x, node.y, 58 + pulse * 2, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${rgb}, 0.2)`;
          ctx.lineWidth = 6;
          ctx.stroke();
        }
      }

    
      if (currentFollowersCount === 4) {
        ctx.beginPath();
        ctx.moveTo(nodes[0].x, nodes[0].y);
        for (let i = 1; i < nodes.length; i++) ctx.lineTo(nodes[i].x, nodes[i].y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      for (const shape of shapes) drawShape(ctx, shape);

     
      if (cursor.visible) {
        ctx.save();
        ctx.translate(cursor.x, cursor.y);
        
        if (isChargingAny) {
          ctx.rotate(now * 0.003); 
        }

        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, 35, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 12]); 
        ctx.stroke();
        ctx.restore();
      }

     
      const btnX = 40, btnY = 30, btnW = 150, btnH = 45;
      const hoveringBack = cursor.visible && 
                           cursor.x >= btnX && cursor.x <= (btnX + btnW) && 
                           cursor.y >= btnY && cursor.y <= (btnY + btnH);

      if (hoveringBack) {
        hubChargeRef.current += 0.025;
        if (hubChargeRef.current >= 1) {
          window.location.href = 'index.html';
        }
      } else {
        hubChargeRef.current = Math.max(0, hubChargeRef.current - 0.05);
      }

      ctx.fillStyle = hoveringBack ? 'rgba(255, 122, 26, 0.15)' : 'rgba(255, 255, 255, 0.04)';
      ctx.strokeStyle = hoveringBack ? 'rgb(255, 122, 26)' : 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 6);
      ctx.fill();
      ctx.stroke();

      if (hubChargeRef.current > 0) {
        ctx.fillStyle = 'rgb(255, 122, 26)';
        ctx.fillRect(btnX, btnY + btnH - 4, btnW * hubChargeRef.current, 4);
      }

      ctx.textAlign = 'center';
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillStyle = hoveringBack ? 'rgb(255, 122, 26)' : '#FFFFFF';
      ctx.fillText('← VOLVER', btnX + (btnW / 2), btnY + 28);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 18px system-ui, sans-serif';
      ctx.letterSpacing = '3px';
      ctx.fillText('COLABORACIÓN', CANVAS_W - 40, 50);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '400 13px system-ui, sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillText('(Progresión y coexistencia)', CANVAS_W - 40, 72);

      rafRef.current = requestAnimationFrame(loop);
    }
    
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [ready]);

  return (
    <div style={{ background: BG, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div style={{ position: 'relative', width: '100%', maxWidth: 900 }}>
        <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} style={{ width: '100%', display: 'block', background: BG, borderRadius: 8, boxShadow: '0 0 20px rgba(0,0,0,0.5)' }} />
        <video ref={videoRef} muted playsInline style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} />
        {status.startsWith('Error') && (
          <p style={{ position: 'absolute', bottom: 8, left: 8, margin: 0, color: '#ff6b6b', fontSize: 12, background: 'rgba(0,0,0,0.65)', padding: '4px 8px', borderRadius: 4 }}>{status}</p>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

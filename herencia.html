<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Herencia (como legado)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useCallback } = React;

const BG = '#050505';
const CANVAS_W = 1280;
const CANVAS_H = 720;
const SHAPE_TYPES = ['cuadrado', 'circulo', 'triangulo']; 
const SELECTION_RADIUS = 95;      
const RELEASE_RADIUS = 170;       
const AUTO_DESELECT_MS = 6000;    
const SMOOTH_FACTOR = 0.35;       
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const TASKS_VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

function randomColor() {
  const hues = [280, 355, 40, 205, 190, 130, 320, 25, 260];
  const h = hues[Math.floor(Math.random() * hues.length)];
  const s = 55 + Math.random() * 25;
  const l = 38 + Math.random() * 14;
  return `hsl(${h.toFixed(0)}, ${s.toFixed(0)}%, ${l.toFixed(0)}%)`;
}

function initialShapes() {
  const positions = [
    [170, 160], [470, 250], [850, 140], [1110, 210],
    [250, 520], [610, 470], [960, 560], [1170, 460], [540, 120],
  ];
  return positions.map((p, i) => ({
    id: i + 1,
    forma: SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)],
    color: randomColor(),
    x: p[0], y: p[1],
    activo: false,
    selectedAt: 0,
    armed: true,
  }));
}

function drawShape(ctx, shape, sizeBase = 46) {
  const size = sizeBase * (shape.activo ? 1.35 : 1);
  
  ctx.save();
  ctx.translate(shape.x, shape.y);
  ctx.fillStyle = shape.color; 

  if (shape.activo) {
    ctx.strokeStyle = '#FFFFFF'; 
    ctx.lineWidth = 5;           
  } else {
    ctx.strokeStyle = 'transparent';
    ctx.lineWidth = 0;
  }

  ctx.beginPath();
  if (shape.forma === 'cuadrado') {
    ctx.rect(-size / 2, -size / 2, size, size);
  } else if (shape.forma === 'circulo') {
    ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
  } else {
    ctx.moveTo(-size / 2, size / 2);
    ctx.lineTo(size / 2, 0);
    ctx.lineTo(-size / 2, -size / 2);
    ctx.closePath();
  }
  
  ctx.fill();
  if (shape.activo) ctx.stroke(); 
  ctx.restore();
}

function App() {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const landmarkerRef = useRef(null);
  const shapesRef = useRef(initialShapes());
  const cursorRef = useRef({ x: CANVAS_W / 2, y: CANVAS_H / 2, visible: false });
  const nextIdRef = useRef(10);
  const hubChargeRef = useRef(0); 
  const rafRef = useRef(null);

  const [status, setStatus] = useState('Iniciando camara...');
  const [ready, setReady] = useState(false);


  const fuse = useCallback((p1, p2) => {
    const forma = Math.random() > 0.5 ? p1.forma : p2.forma;
    const color = Math.random() > 0.5 ? p1.color : p2.color;
    const nx = (p1.x + p2.x) / 2;
    const ny = (p1.y + p2.y) / 2;
    
    const child = {
      id: nextIdRef.current++,
      forma, color, x: nx, y: ny,
      activo: false, selectedAt: 0,
      armed: false, 
    };
    
    p1.activo = false;
    p1.armed = false;
    p2.activo = false;
    p2.armed = false;
    
    shapesRef.current = [...shapesRef.current, child];
  }, []);

  useEffect(() => {
    let stream;
    let cancelled = false;

    async function setup() {
      try {
        setStatus('Cargando modelo de tracking...');
        const { HandLandmarker, FilesetResolver } = await import(TASKS_VISION_URL);
        const vision = await FilesetResolver.forVisionTasks(`${TASKS_VISION_URL}/wasm`);

        let landmarker;
        try {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        } catch (gpuErr) {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        }
        if (cancelled) return;
        landmarkerRef.current = landmarker;

        setStatus('Pidiendo acceso a la camara...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }, audio: false,
        });
        if (cancelled) return;
        videoRef.current.srcObject = stream;
        await new Promise((res) => { videoRef.current.onloadedmetadata = res; });
        await videoRef.current.play();
        setStatus('Listo');
        setReady(true);
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }
    setup();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  useEffect(() => {
    if (!ready) return;
    const ctx = canvasRef.current.getContext('2d');
    let lastVideoTime = -1;

    function loop() {
      const now = performance.now();
      const video = videoRef.current;
      const landmarker = landmarkerRef.current;


      if (video.readyState >= 2 && landmarker) {
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = landmarker.detectForVideo(video, now);
          if (result.landmarks && result.landmarks.length > 0) {
            const tip = result.landmarks[0][8]; 
            const targetX = (1 - tip.x) * CANVAS_W; 
            const targetY = tip.y * CANVAS_H;
            const c = cursorRef.current;
            c.x += (targetX - c.x) * SMOOTH_FACTOR;
            c.y += (targetY - c.y) * SMOOTH_FACTOR;
            c.visible = true;
          } else {
            cursorRef.current.visible = false;
          }
        }
      }

      const shapes = shapesRef.current;
      const cursor = cursorRef.current;

      if (cursor.visible) {
        let best = null, bestD = Infinity;
        for (const s of shapes) {
          if (s.activo || !s.armed) continue;
          const d = Math.hypot(cursor.x - s.x, cursor.y - s.y);
          if (d < bestD) { bestD = d; best = s; }
        }
        
        const activosPrevios = shapes.filter((s) => s.activo);
        if (best && bestD < SELECTION_RADIUS && activosPrevios.length < 2) {
          best.activo = true;
          best.selectedAt = now;
        }
      }

      for (const s of shapes) {
        if (!s.armed && cursor.visible) {
          const d = Math.hypot(cursor.x - s.x, cursor.y - s.y);
          if (d > RELEASE_RADIUS) s.armed = true;
        }
      }

      const activos = shapes.filter((s) => s.activo);
      if (activos.length === 1 && now - activos[0].selectedAt > AUTO_DESELECT_MS) {
        activos[0].activo = false;
        activos[0].armed = false;
      }
      
      if (activos.length === 2) {
        fuse(activos[0], activos[1]);
      }

      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      
      for (const s of shapesRef.current) drawShape(ctx, s);


      if (cursor.visible) {
        ctx.beginPath();
        ctx.arc(cursor.x, cursor.y, 8, 0, Math.PI * 2);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.stroke();
      }


      const btnX = 40, btnY = 30, btnW = 150, btnH = 45;
      const hoveringBack = cursor.visible && 
                           cursor.x >= btnX && cursor.x <= (btnX + btnW) && 
                           cursor.y >= btnY && cursor.y <= (btnY + btnH);

      if (hoveringBack) {
        hubChargeRef.current += 0.025;
        if (hubChargeRef.current >= 1) {
          window.location.href = 'index.html'; 
        }
      } else {
        hubChargeRef.current = Math.max(0, hubChargeRef.current - 0.05);
      }


      ctx.fillStyle = hoveringBack ? 'rgba(255, 122, 26, 0.15)' : 'rgba(255, 255, 255, 0.04)';
      ctx.strokeStyle = hoveringBack ? 'rgb(255, 122, 26)' : 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 6);
      ctx.fill();
      ctx.stroke();

      if (hubChargeRef.current > 0) {
        ctx.fillStyle = 'rgb(255, 122, 26)';
        ctx.fillRect(btnX, btnY + btnH - 4, btnW * hubChargeRef.current, 4);
      }

  
      ctx.textAlign = 'center';
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillStyle = hoveringBack ? 'rgb(255, 122, 26)' : '#FFFFFF';
      ctx.fillText('← VOLVER', btnX + (btnW / 2), btnY + 28);

   
      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 18px system-ui, sans-serif';
      ctx.letterSpacing = '3px';
      ctx.fillText('HERENCIA', CANVAS_W - 40, 50);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '400 13px system-ui, sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillText('(Como legado)', CANVAS_W - 40, 72);

      rafRef.current = requestAnimationFrame(loop);
    }
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [ready, fuse]);

  return (
    <div style={{
      background: BG, minHeight: '100vh', display: 'flex',
      alignItems: 'center', justifyContent: 'center', padding: 16,
    }}>
      <div style={{ position: 'relative', width: '100%', maxWidth: 900 }}>
        <canvas
          ref={canvasRef}
          width={CANVAS_W}
          height={CANVAS_H}
          style={{ width: '100%', display: 'block', background: BG, borderRadius: 8, boxShadow: '0 0 20px rgba(0,0,0,0.5)' }}
        />
        <video
          ref={videoRef}
          muted
          playsInline
          style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }}
        />
        {status.startsWith('Error') && (
          <p style={{
            position: 'absolute', bottom: 8, left: 8, margin: 0, color: '#ff6b6b',
            fontSize: 12, padding: '4px 8px',
          }}>{status}</p>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

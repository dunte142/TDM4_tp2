<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memoria (Como registro)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;

const BG = '#050505';
const CANVAS_W = 1280;
const CANVAS_H = 720;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const TASKS_VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const ACCENT_COLOR = '255, 122, 26'; 
const GRAY_COLOR = '150, 150, 150';  
const NUM_MEMORIES = 250;            
const SMOOTH_FACTOR = 0.2;

function generateArchive() {
  const archive = [];
  for (let i = 0; i < NUM_MEMORIES; i++) {
    const isOrange = Math.random() > 0.85; 
    const randShape = Math.random();
    let type = 'cuadrado';
    if (randShape > 0.7) type = 'circulo';
    if (randShape > 0.9) type = 'triangulo';

    archive.push({
      id: i,
      x: Math.random() * CANVAS_W,
      y: Math.random() * CANVAS_H,
      size: 6 + Math.random() * 12, 
      isOrange,
      type,
      baseAlpha: 0.3 + Math.random() * 0.7, 
      floatSpeedY: (Math.random() - 0.5) * 0.2, 
      floatSpeedX: (Math.random() - 0.5) * 0.2
    });
  }
  return archive;
}

function drawScanlines(ctx) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
  for (let y = 0; y < CANVAS_H; y += 6) {
    ctx.fillRect(0, y, CANVAS_W, 1);
  }
}

function drawMemory(ctx, mem, globalVisibility, cursor) {
  let localAlpha = mem.baseAlpha * globalVisibility;
  if (cursor.visible && globalVisibility > 0.01) {
    const dist = Math.hypot(mem.x - cursor.x, mem.y - cursor.y);
    const spotlight = Math.max(0, 1 - (dist / 350));
    localAlpha = localAlpha * (0.2 + spotlight * 0.8);
  } else {
    localAlpha = localAlpha * 0.2;
  }

  if (localAlpha <= 0.02) return; 

  const colorStr = mem.isOrange ? ACCENT_COLOR : GRAY_COLOR;
  ctx.fillStyle = `rgba(${colorStr}, ${localAlpha})`;
  
  ctx.beginPath();
  if (mem.type === 'cuadrado') {
    ctx.rect(mem.x - mem.size / 2, mem.y - mem.size / 2, mem.size, mem.size);
  } else if (mem.type === 'circulo') {
    ctx.arc(mem.x, mem.y, mem.size / 2, 0, Math.PI * 2);
  } else {
    ctx.moveTo(mem.x, mem.y - mem.size / 2);
    ctx.lineTo(mem.x + mem.size / 2, mem.y + mem.size / 2);
    ctx.lineTo(mem.x - mem.size / 2, mem.y + mem.size / 2);
    ctx.closePath();
  }
  ctx.fill();
}

function App() {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const landmarkerRef = useRef(null);
  const archiveRef = useRef(generateArchive());
  
  const cursorRef = useRef({ x: CANVAS_W / 2, y: CANVAS_H / 2, visible: false });
  const globalVisibilityRef = useRef(0);
  const hubChargeRef = useRef(0); 
  const rafRef = useRef(null);

  const [status, setStatus] = useState('Iniciando camara...');
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let stream;
    let cancelled = false;

    async function setup() {
      try {
        setStatus('Cargando modelo de tracking...');
        const { HandLandmarker, FilesetResolver } = await import(TASKS_VISION_URL);
        const vision = await FilesetResolver.forVisionTasks(`${TASKS_VISION_URL}/wasm`);

        let landmarker;
        try {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        } catch (gpuErr) {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        }
        if (cancelled) return;
        landmarkerRef.current = landmarker;

        setStatus('Pidiendo acceso a la camara...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }, audio: false,
        });
        if (cancelled) return;
        videoRef.current.srcObject = stream;
        await new Promise((res) => { videoRef.current.onloadedmetadata = res; });
        await videoRef.current.play();
        setStatus('Listo -- levanta tu mano para recordar');
        setReady(true);
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }
    setup();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  useEffect(() => {
    if (!ready) return;
    const ctx = canvasRef.current.getContext('2d');
    let lastVideoTime = -1;

    function loop() {
      const video = videoRef.current;
      const landmarker = landmarkerRef.current;
      const cursor = cursorRef.current;
      const archive = archiveRef.current;


      if (video.readyState >= 2 && landmarker) {
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = landmarker.detectForVideo(video, performance.now());
          
          if (result.landmarks && result.landmarks.length > 0) {
            const hand = result.landmarks[0];
            const palmX = (hand[0].x + hand[9].x) / 2;
            const palmY = (hand[0].y + hand[9].y) / 2;
            const targetX = (1 - palmX) * CANVAS_W;
            const targetY = palmY * CANVAS_H;
            
            cursor.x += (targetX - cursor.x) * SMOOTH_FACTOR;
            cursor.y += (targetY - cursor.y) * SMOOTH_FACTOR;
            cursor.visible = true;
          } else {
            cursor.visible = false;
          }
        }
      }


      const targetVisibility = cursor.visible ? 1.0 : 0.0;
      globalVisibilityRef.current += (targetVisibility - globalVisibilityRef.current) * 0.03;

      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);


      for (const mem of archive) {
        mem.x += mem.floatSpeedX;
        mem.y += mem.floatSpeedY;
        if (mem.x > CANVAS_W + 20) mem.x = -20;
        if (mem.x < -20) mem.x = CANVAS_W + 20;
        if (mem.y > CANVAS_H + 20) mem.y = -20;
        if (mem.y < -20) mem.y = CANVAS_H + 20;
        drawMemory(ctx, mem, globalVisibilityRef.current, cursor);
      }

      drawScanlines(ctx);


      if (cursor.visible) {
        ctx.beginPath();
        ctx.arc(cursor.x, cursor.y, 8, 0, Math.PI * 2);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.stroke();
      }


      const btnX = 40, btnY = 30, btnW = 150, btnH = 45;
      const hoveringBack = cursor.visible && 
                           cursor.x >= btnX && cursor.x <= (btnX + btnW) && 
                           cursor.y >= btnY && cursor.y <= (btnY + btnH);

      if (hoveringBack) {
        hubChargeRef.current += 0.025;
        if (hubChargeRef.current >= 1) {
          window.location.href = 'index.html';
        }
      } else {
        hubChargeRef.current = Math.max(0, hubChargeRef.current - 0.05);
      }

      ctx.fillStyle = hoveringBack ? 'rgba(255, 122, 26, 0.15)' : 'rgba(255, 255, 255, 0.04)';
      ctx.strokeStyle = hoveringBack ? 'rgb(255, 122, 26)' : 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 6);
      ctx.fill();
      ctx.stroke();


      if (hubChargeRef.current > 0) {
        ctx.fillStyle = 'rgb(255, 122, 26)';
        ctx.fillRect(btnX, btnY + btnH - 4, btnW * hubChargeRef.current, 4);
      }


      ctx.textAlign = 'center';
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillStyle = hoveringBack ? 'rgb(255, 122, 26)' : '#FFFFFF';
      ctx.fillText('← VOLVER', btnX + (btnW / 2), btnY + 28);


      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 18px system-ui, sans-serif';
      ctx.letterSpacing = '3px';
      ctx.fillText('MEMORIA', CANVAS_W - 40, 50);
      
      // Subtítulo
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '400 13px system-ui, sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillText('(Como registro)', CANVAS_W - 40, 72);
   

      rafRef.current = requestAnimationFrame(loop);
    }
    
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [ready]);

  return (
    <div style={{ background: '#000', minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div style={{ position: 'relative', width: '100%', maxWidth: 900 }}>
        <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} style={{ width: '100%', display: 'block', background: '#000', borderRadius: 8, boxShadow: '0 0 20px rgba(0,0,0,0.8)' }} />
        <video ref={videoRef} muted playsInline style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} />
        {status.startsWith('Error') && (
          <p style={{ position: 'absolute', bottom: 8, left: 8, margin: 0, color: '#ff6b6b', fontSize: 12, background: 'rgba(0,0,0,0.65)', padding: '4px 8px', borderRadius: 4 }}>{status}</p>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

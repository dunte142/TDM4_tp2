<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Empatia (Comprension del otro) - Orbital</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;

const BG = '#000000';
const CANVAS_W = 1280;
const CANVAS_H = 720;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const TASKS_VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const START_COLOR = { r: 255, g: 122, b: 26 }; 
const EMPATHY_RADIUS = 220;       
const EMPATHY_BUILD_RATE = 0.012; 
const EMPATHY_FADE_RATE = 0.02;   
const SMOOTH_FACTOR = 0.35;

const SHAPE_TYPES = ['cuadrado', 'circulo', 'triangulo'];
const COLORS = [
  { r: 52, g: 199, b: 89 },  
  { r: 0, g: 122, b: 255 },   
  { r: 175, g: 82, b: 222 },  
  { r: 255, g: 45, b: 85 },   
  { r: 255, g: 204, b: 0 }    
];

function spawnShape(id) {
  const color = COLORS[id % COLORS.length];
  return {
    id,
    forma: SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)],
    originalColor: { ...color },
    currentColor: { ...color },
    x: 100 + Math.random() * (CANVAS_W - 200),
    y: 100 + Math.random() * (CANVAS_H - 200),
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5,
    size: 40,
    empathy: 0,       
    connected: false,   
    orbitAngle: 0,      
    orbitRadius: 90 + Math.random() * 60, 
    orbitSpeed: (Math.random() > 0.5 ? 1 : -1) * (0.015 + Math.random() * 0.02), 
    phase: Math.random() * Math.PI * 2
  };
}

function lerpColor(c1, c2, t) {
  return {
    r: c1.r + (c2.r - c1.r) * t,
    g: c1.g + (c2.g - c1.g) * t,
    b: c1.b + (c2.b - c1.b) * t
  };
}

function rgbString(c, alpha = 1) {
  return `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
}

function drawShape(ctx, shape, now) {
  ctx.save();
  ctx.translate(shape.x, shape.y);
  
  let currentSize = shape.size;

  if (shape.connected) {
    currentSize += Math.sin(now * 0.005 + shape.phase) * 5;
  }

  ctx.fillStyle = rgbString(shape.currentColor);
  ctx.beginPath();
  
  if (shape.forma === 'cuadrado') {
    ctx.rect(-currentSize / 2, -currentSize / 2, currentSize, currentSize);
  } else if (shape.forma === 'circulo') {
    ctx.arc(0, 0, currentSize / 2, 0, Math.PI * 2);
  } else {
    ctx.moveTo(-currentSize / 2, currentSize / 2);
    ctx.lineTo(currentSize / 2, 0);
    ctx.lineTo(-currentSize / 2, -currentSize / 2);
    ctx.closePath();
  }
  
  ctx.fill();
  
 
  if (shape.empathy > 0 || shape.connected) {
    const alpha = shape.connected ? 0.8 : shape.empathy * 0.7;
    ctx.strokeStyle = rgbString(shape.currentColor, alpha);
    ctx.lineWidth = shape.connected ? 4 : 4 + (shape.empathy * 6);
    ctx.stroke();
  }
  
  ctx.restore();
}

function App() {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const landmarkerRef = useRef(null);
  const shapesRef = useRef(Array.from({ length: 6 }, (_, i) => spawnShape(i)));
  
  const cursorRef = useRef({ 
    x: CANVAS_W / 2, y: CANVAS_H / 2, visible: false, 
    baseColor: { ...START_COLOR }, 
    drawColor: { ...START_COLOR } 
  });
  
  const hubChargeRef = useRef(0);
  const rafRef = useRef(null);
  const [status, setStatus] = useState('Iniciando camara...');
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let stream;
    let cancelled = false;

    async function setup() {
      try {
        setStatus('Cargando modelo de tracking...');
        const { HandLandmarker, FilesetResolver } = await import(TASKS_VISION_URL);
        const vision = await FilesetResolver.forVisionTasks(`${TASKS_VISION_URL}/wasm`);

        let landmarker;
        try {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        } catch (gpuErr) {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        }
        if (cancelled) return;
        landmarkerRef.current = landmarker;

        setStatus('Pidiendo acceso a la camara...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }, audio: false,
        });
        if (cancelled) return;
        videoRef.current.srcObject = stream;
        await new Promise((res) => { videoRef.current.onloadedmetadata = res; });
        await videoRef.current.play();
        setStatus('Listo -- guiá tu mano y asimilá las figuras');
        setReady(true);
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }
    setup();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  useEffect(() => {
    if (!ready) return;
    const ctx = canvasRef.current.getContext('2d');
    let lastVideoTime = -1;

    function loop() {
      const now = performance.now();
      const video = videoRef.current;
      const landmarker = landmarkerRef.current;
      const cursor = cursorRef.current;
      const shapes = shapesRef.current;

     
      if (video.readyState >= 2 && landmarker) {
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = landmarker.detectForVideo(video, now);
          if (result.landmarks && result.landmarks.length > 0) {
            const tip = result.landmarks[0][8]; 
            const targetX = (1 - tip.x) * CANVAS_W;
            const targetY = tip.y * CANVAS_H;
            cursor.x += (targetX - cursor.x) * SMOOTH_FACTOR;
            cursor.y += (targetY - cursor.y) * SMOOTH_FACTOR;
            cursor.visible = true;
          } else {
            cursor.visible = false;
          }
        }
      }

    
      let closestUnconnected = null;
      let minDistance = Infinity;

      for (const s of shapes) {
        if (s.connected) {
          s.orbitAngle += s.orbitSpeed;
          const targetX = cursor.x + Math.cos(s.orbitAngle) * s.orbitRadius;
          const targetY = cursor.y + Math.sin(s.orbitAngle) * s.orbitRadius;
          
          s.x += (targetX - s.x) * 0.15;
          s.y += (targetY - s.y) * 0.15;

        
          s.currentColor = lerpColor(s.currentColor, cursor.baseColor, 0.05);
        } else {
          s.vx += (Math.random() - 0.5) * 0.15;
          s.vy += (Math.random() - 0.5) * 0.15;
          
          const speed = Math.hypot(s.vx, s.vy);
          if (speed > 1.5) { s.vx = (s.vx / speed) * 1.5; s.vy = (s.vy / speed) * 1.5; }
          
          s.x += s.vx; s.y += s.vy;
          
          if (s.x < 30) { s.x = 30; s.vx *= -1; }
          if (s.x > CANVAS_W - 30) { s.x = CANVAS_W - 30; s.vx *= -1; }
          if (s.y < 30) { s.y = 30; s.vy *= -1; }
          if (s.y > CANVAS_H - 30) { s.y = CANVAS_H - 30; s.vy *= -1; }

          s.currentColor = lerpColor(s.currentColor, s.originalColor, 0.05);

          if (cursor.visible) {
            const d = Math.hypot(cursor.x - s.x, cursor.y - s.y);
            if (d < EMPATHY_RADIUS && d < minDistance) {
              minDistance = d;
              closestUnconnected = s;
            }
          }
        }
      }

      let isConnecting = false;

      for (const s of shapes) {
        if (s.connected) continue;

        if (s === closestUnconnected) {
          isConnecting = true;
          s.empathy = Math.min(1, s.empathy + EMPATHY_BUILD_RATE);
          
         
          cursor.drawColor = lerpColor(cursor.baseColor, s.originalColor, s.empathy * 0.25);
          
          s.vx *= 0.8;
          s.vy *= 0.8;

          if (s.empathy >= 1) {
            s.connected = true;
            
        
            cursor.baseColor = lerpColor(cursor.baseColor, s.originalColor, 0.25);
            
            s.orbitAngle = Math.atan2(s.y - cursor.y, s.x - cursor.x);
          }
        } else {
          s.empathy = Math.max(0, s.empathy - EMPATHY_FADE_RATE);
        }
      }

      if (!isConnecting) {
        cursor.drawColor = lerpColor(cursor.drawColor, cursor.baseColor, 0.1);
      }

    
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

     
      for (const s of shapes) {
        if ((s.empathy > 0 || s.connected) && cursor.visible) {
          const lineAlpha = s.connected ? 1 : s.empathy; 
          
        
          ctx.beginPath();
          ctx.moveTo(cursor.x, cursor.y);
          ctx.lineTo(s.x, s.y);
          ctx.strokeStyle = rgbString(s.currentColor, lineAlpha * 0.4);
          ctx.lineWidth = s.connected ? 14 : 4 + (s.empathy * 10);
          ctx.shadowBlur = 25;
          ctx.shadowColor = rgbString(s.currentColor, lineAlpha);
          ctx.stroke();

        
          ctx.beginPath();
          ctx.moveTo(cursor.x, cursor.y);
          ctx.lineTo(s.x, s.y);
          ctx.strokeStyle = rgbString(s.currentColor, lineAlpha * 0.9);
          ctx.lineWidth = s.connected ? 6 : 2 + (s.empathy * 4);
          ctx.shadowBlur = 10;
          ctx.stroke();

         
          ctx.beginPath();
          ctx.moveTo(cursor.x, cursor.y);
          ctx.lineTo(s.x, s.y);
          ctx.strokeStyle = `rgba(255, 255, 255, ${s.connected ? 0.9 : s.empathy * 0.9})`;
          ctx.lineWidth = s.connected ? 2 : 1 + (s.empathy);
          ctx.shadowBlur = 0; 
          ctx.stroke();
        }
      }

      for (const s of shapes) {
        drawShape(ctx, s, now);
      }

     
      if (cursor.visible) {
        const anyConnected = shapes.some(s => s.connected);
        let myRadius = 15;

        if (anyConnected) {
          myRadius += Math.sin(now * 0.005) * 3;
          ctx.beginPath();
          ctx.arc(cursor.x, cursor.y, myRadius + 12 + (Math.sin(now * 0.01) * 6), 0, Math.PI * 2);
          ctx.strokeStyle = rgbString(cursor.drawColor, 0.4);
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(cursor.x, cursor.y, myRadius, 0, Math.PI * 2);
        ctx.fillStyle = rgbString(cursor.drawColor);
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

  
      const btnX = 40, btnY = 30, btnW = 150, btnH = 45;
      const hoveringBack = cursor.visible && 
                           cursor.x >= btnX && cursor.x <= (btnX + btnW) && 
                           cursor.y >= btnY && cursor.y <= (btnY + btnH);

      if (hoveringBack) {
        hubChargeRef.current += 0.025;
        if (hubChargeRef.current >= 1) {
          window.location.href = 'index.html';
        }
      } else {
        hubChargeRef.current = Math.max(0, hubChargeRef.current - 0.05);
      }

     
      ctx.fillStyle = hoveringBack ? 'rgba(255, 122, 26, 0.15)' : 'rgba(255, 255, 255, 0.04)';
      ctx.strokeStyle = hoveringBack ? 'rgb(255, 122, 26)' : 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 6);
      ctx.fill();
      ctx.stroke();

     
      if (hubChargeRef.current > 0) {
        ctx.fillStyle = 'rgb(255, 122, 26)';
        ctx.fillRect(btnX, btnY + btnH - 4, btnW * hubChargeRef.current, 4);
      }

    
      ctx.textAlign = 'center';
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillStyle = hoveringBack ? 'rgb(255, 122, 26)' : '#FFFFFF';
      ctx.fillText('← VOLVER', btnX + (btnW / 2), btnY + 28);

    
      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 18px system-ui, sans-serif';
      ctx.letterSpacing = '3px';
      ctx.fillText('EMPATÍA', CANVAS_W - 40, 50);
      
  
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '400 13px system-ui, sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillText('(Comprensión del otro)', CANVAS_W - 40, 72);
      

      rafRef.current = requestAnimationFrame(loop);
    }
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [ready]);

  return (
    <div style={{ background: BG, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div style={{ position: 'relative', width: '100%', maxWidth: 900 }}>
        <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} style={{ width: '100%', display: 'block', background: BG, borderRadius: 8, boxShadow: '0 0 20px rgba(0,0,0,0.5)' }} />
        <video ref={videoRef} muted playsInline style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} />
        {status.startsWith('Error') && (
          <p style={{ position: 'absolute', bottom: 8, left: 8, margin: 0, color: '#ff6b6b', fontSize: 12, background: 'rgba(0,0,0,0.65)', padding: '4px 8px', borderRadius: 4 }}>{status}</p>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

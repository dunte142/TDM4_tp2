<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Incertidumbre (Como desconocimiento del devenir)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;


const BG = '#050505';
const CANVAS_W = 1280;
const CANVAS_H = 720;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const TASKS_VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';


const TOUCH_RADIUS = 60;         
const SMOOTH_FACTOR = 0.35;
const SHAPE_COUNT = 12;          

const SHAPE_TYPES = ['cuadrado', 'circulo', 'triangulo', 'rombo'];
const COLORS = [
  '255, 122, 26', 
  '52, 199, 89',   
  '0, 122, 255',   
  '175, 82, 222',  
  '255, 204, 0',   
  '255, 45, 85'    
];

function spawnShape(id) {
  return {
    id,
    forma: SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)],
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    x: 100 + Math.random() * (CANVAS_W - 200),
    y: 100 + Math.random() * (CANVAS_H - 200),
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    

    currentSize: 45,
    targetSize: 45,
    

    orbitAngle: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.05,
    

    lastReactionTime: 0,
    flashAlpha: 0 
  };
}

function drawShape(ctx, shape, now) {
  ctx.save();
  ctx.translate(shape.x, shape.y);
  

  shape.orbitAngle += shape.rotSpeed;
  ctx.rotate(shape.orbitAngle);
  

  shape.currentSize += (shape.targetSize - shape.currentSize) * 0.1;
  const s = shape.currentSize;

 
  ctx.fillStyle = `rgb(${shape.color})`;
  

  ctx.shadowBlur = 15;
  ctx.shadowColor = `rgba(${shape.color}, 0.5)`;


  ctx.beginPath();
  if (shape.forma === 'cuadrado') {
    ctx.rect(-s / 2, -s / 2, s, s);
  } else if (shape.forma === 'circulo') {
    ctx.arc(0, 0, s / 2, 0, Math.PI * 2);
  } else if (shape.forma === 'triangulo') {
    ctx.moveTo(0, -s / 2);
    ctx.lineTo(s / 2, s / 2);
    ctx.lineTo(-s / 2, s / 2);
    ctx.closePath();
  } else if (shape.forma === 'rombo') {
    ctx.moveTo(0, -s / 2);
    ctx.lineTo(s / 2, 0);
    ctx.lineTo(0, s / 2);
    ctx.lineTo(-s / 2, 0);
    ctx.closePath();
  }
  
  ctx.fill();


  if (shape.flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255, 255, 255, ${shape.flashAlpha})`;
    ctx.fill();
    shape.flashAlpha *= 0.9; 
  }
  
  ctx.restore();
}

function App() {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const landmarkerRef = useRef(null);
  
  const shapesRef = useRef(Array.from({ length: SHAPE_COUNT }, (_, i) => spawnShape(i)));
  const shockwavesRef = useRef([]); 
  const cursorRef = useRef({ x: CANVAS_W / 2, y: CANVAS_H / 2, visible: false });
  const hubChargeRef = useRef(0);
  const rafRef = useRef(null);

  const [status, setStatus] = useState('Iniciando camara...');
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let stream;
    let cancelled = false;

    async function setup() {
      try {
        setStatus('Cargando modelo de tracking...');
        const { HandLandmarker, FilesetResolver } = await import(TASKS_VISION_URL);
        const vision = await FilesetResolver.forVisionTasks(`${TASKS_VISION_URL}/wasm`);

        let landmarker;
        try {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        } catch (gpuErr) {
          landmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
            runningMode: 'VIDEO',
            numHands: 1,
          });
        }
        if (cancelled) return;
        landmarkerRef.current = landmarker;

        setStatus('Pidiendo acceso a la camara...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }, audio: false,
        });
        if (cancelled) return;
        videoRef.current.srcObject = stream;
        await new Promise((res) => { videoRef.current.onloadedmetadata = res; });
        await videoRef.current.play();
        setStatus('Listo -- Tocá las figuras para activar reacciones impredecibles');
        setReady(true);
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }
    setup();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  useEffect(() => {
    if (!ready) return;
    const ctx = canvasRef.current.getContext('2d');
    let lastVideoTime = -1;

    function loop() {
      const now = performance.now();
      const video = videoRef.current;
      const landmarker = landmarkerRef.current;
      const cursor = cursorRef.current;
      const shapes = shapesRef.current;
      const shockwaves = shockwavesRef.current;


      if (video.readyState >= 2 && landmarker) {
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const result = landmarker.detectForVideo(video, now);
          if (result.landmarks && result.landmarks.length > 0) {
            const tip = result.landmarks[0][8]; 
            const targetX = (1 - tip.x) * CANVAS_W;
            const targetY = tip.y * CANVAS_H;
            
            cursor.x += (targetX - cursor.x) * SMOOTH_FACTOR;
            cursor.y += (targetY - cursor.y) * SMOOTH_FACTOR;
            cursor.visible = true;
          } else {
            cursor.visible = false;
          }
        }
      }


      for (const shape of shapes) {
        if (cursor.visible) {
          const dist = Math.hypot(cursor.x - shape.x, cursor.y - shape.y);
          
      
          if (dist < TOUCH_RADIUS && (now - shape.lastReactionTime > 1000)) {
            shape.lastReactionTime = now;
            shape.flashAlpha = 1; 
            
            shockwaves.push({ x: shape.x, y: shape.y, radius: shape.currentSize, alpha: 1 });

         
            const reactionType = Math.floor(Math.random() * 5); 

            if (reactionType === 0) {
              shape.targetSize = 100 + Math.random() * 60;
              shape.forma = SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)];
              shape.color = COLORS[Math.floor(Math.random() * COLORS.length)];
              shape.vx *= 0.1;
              shape.vy *= 0.1;
              shape.rotSpeed = 0.01;
            } 
            else if (reactionType === 1) {
              shape.targetSize = 15 + Math.random() * 10;
              shape.vx = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 15);
              shape.vy = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 15);
              shape.rotSpeed = 0.4; 
            } 
            else if (reactionType === 2) {
              shape.x = 100 + Math.random() * (CANVAS_W - 200);
              shape.y = 100 + Math.random() * (CANVAS_H - 200);
              shape.forma = SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)];
              shape.color = COLORS[Math.floor(Math.random() * COLORS.length)];
              shape.vx = 0;
              shape.vy = 0;
              shockwaves.push({ x: shape.x, y: shape.y, radius: 10, alpha: 1 });
            } 
            else if (reactionType === 3) {
              shape.vx = 0;
              shape.vy = 0;
              shape.targetSize = 40 + Math.random() * 30;
              shape.forma = SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)];
              shape.color = COLORS[Math.floor(Math.random() * COLORS.length)];
              shape.rotSpeed = 0; 
            } 
            else if (reactionType === 4) {
              shape.vx = -shape.vx * 2;
              shape.vy = -shape.vy * 2;
              shape.targetSize = 45;
              shape.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            }
          }
        }

        shape.x += shape.vx;
        shape.y += shape.vy;
        shape.vx *= 0.98;
        shape.vy *= 0.98;

        if (shape.x < 30) { shape.x = 30; shape.vx *= -1; }
        if (shape.x > CANVAS_W - 30) { shape.x = CANVAS_W - 30; shape.vx *= -1; }
        if (shape.y < 30) { shape.y = 30; shape.vy *= -1; }
        if (shape.y > CANVAS_H - 30) { shape.y = CANVAS_H - 30; shape.vy *= -1; }
      }


      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
      for (let y = 0; y < CANVAS_H; y += 4) ctx.fillRect(0, y, CANVAS_W, 1);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        
        sw.radius += 5; 
        sw.alpha -= 0.05; 
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      for (const shape of shapes) {
        drawShape(ctx, shape, now);
      }


      if (cursor.visible) {
        ctx.beginPath();
        ctx.arc(cursor.x, cursor.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cursor.x, cursor.y, TOUCH_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }


      const btnX = 40, btnY = 30, btnW = 150, btnH = 45;
      const hoveringBack = cursor.visible && 
                           cursor.x >= btnX && cursor.x <= (btnX + btnW) && 
                           cursor.y >= btnY && cursor.y <= (btnY + btnH);

      if (hoveringBack) {
        hubChargeRef.current += 0.025;
        if (hubChargeRef.current >= 1) {
          window.location.href = 'index.html';
        }
      } else {
        hubChargeRef.current = Math.max(0, hubChargeRef.current - 0.05);
      }

      ctx.fillStyle = hoveringBack ? 'rgba(255, 122, 26, 0.15)' : 'rgba(255, 255, 255, 0.04)';
      ctx.strokeStyle = hoveringBack ? 'rgb(255, 122, 26)' : 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 6);
      ctx.fill();
      ctx.stroke();

      if (hubChargeRef.current > 0) {
        ctx.fillStyle = 'rgb(255, 122, 26)';
        ctx.fillRect(btnX, btnY + btnH - 4, btnW * hubChargeRef.current, 4);
      }

      ctx.textAlign = 'center';
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillStyle = hoveringBack ? 'rgb(255, 122, 26)' : '#FFFFFF';
      ctx.fillText('← VOLVER', btnX + (btnW / 2), btnY + 28);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 18px system-ui, sans-serif';
      ctx.letterSpacing = '3px';
      ctx.fillText('INCERTIDUMBRE', CANVAS_W - 40, 50);
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '400 13px system-ui, sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillText('(Desconocimiento del devenir)', CANVAS_W - 40, 72);


      rafRef.current = requestAnimationFrame(loop);
    }
    
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [ready]);

  return (
    <div style={{ background: BG, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div style={{ position: 'relative', width: '100%', maxWidth: 900 }}>
        <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} style={{ width: '100%', display: 'block', background: BG, borderRadius: 8, boxShadow: '0 0 20px rgba(0,0,0,0.5)' }} />
        <video ref={videoRef} muted playsInline style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} />
        {status.startsWith('Error') && (
          <p style={{ position: 'absolute', bottom: 8, left: 8, margin: 0, color: '#ff6b6b', fontSize: 12, background: 'rgba(0,0,0,0.65)', padding: '4px 8px', borderRadius: 4 }}>{status}</p>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
